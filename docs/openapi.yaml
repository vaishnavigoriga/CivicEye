openapi: 3.0.3
info:
  title: CivicEye API
  version: 1.0.0
  description: |
    Prototype civic grievance API for Greater Hyderabad. Not connected to any government system.
    Sessions use an HttpOnly cookie named `token`. See docs/API.md for conventions, limits and examples.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - { name: Meta }
  - { name: Auth }
  - { name: Complaints }
  - { name: Voice }
  - { name: Admin }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: token
  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, INVALID_CREDENTIALS, FORBIDDEN, NOT_FOUND, EMAIL_EXISTS, CONFLICT, FILE_INVALID, FILE_TOO_LARGE, LOCATION_OUTSIDE_REGION, RATE_LIMITED, AI_UNAVAILABLE, INTERNAL]
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    Category:
      type: string
      enum: [Roads, Drainage, Waterlogging, Water Supply, Sanitation, Street Lights, Electricity, Public Infrastructure, Other]
    Status:
      type: string
      enum: [submitted, under_review, assigned, in_progress, resolved, rejected]
    Provenance:
      type: string
      enum: [CITIZEN, DEMO, IMPORTED_OFFICIAL]
    Language:
      type: string
      enum: [en, te, hi]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [citizen, admin] }
        phone: { type: string }
        preferredLanguage: { $ref: '#/components/schemas/Language' }
    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
    Complaint:
      type: object
      description: Public view. Never contains reporter identity.
      properties:
        id: { type: string }
        trackingId: { type: string, example: CE-HYD-2026-000001 }
        provenance: { $ref: '#/components/schemas/Provenance' }
        title: { type: string }
        description: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        category: { $ref: '#/components/schemas/Category' }
        categoryVerified: { type: boolean }
        location:
          type: object
          properties:
            address: { type: string }
            area: { type: string }
            accuracy: { type: string, enum: [gps, map_pin, area_approx] }
            coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number }, description: "[lat, lng]" }
        images: { type: array, items: { type: object, properties: { url: { type: string } } } }
        hasAudio: { type: boolean }
        ai:
          type: object
          description: A suggestion only. isSimulated=true or status != ok means this is not a live AI result.
          properties:
            status: { type: string, enum: [ok, fallback, failed] }
            isSimulated: { type: boolean }
            model: { type: string }
            suggestedCategory: { $ref: '#/components/schemas/Category' }
            suggestedDepartment: { type: string }
            keywords: { type: array, items: { type: string } }
            explanation: { type: string }
            publicImpact: { type: string }
        priority:
          type: object
          description: Prototype score computed by the backend; not an official standard.
          properties:
            score: { type: integer, minimum: 1, maximum: 100 }
            band: { type: string, enum: [Critical, High, Medium, Low] }
            modelVersion: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        department: { type: object, nullable: true, properties: { code: { type: string }, name: { type: string } } }
        supportCount: { type: integer }
        hasSupported: { type: boolean }
        resolutionEvidence: { type: array, items: { type: object, properties: { url: { type: string }, caption: { type: string } } } }
        createdAt: { type: string, format: date-time }
    Update:
      type: object
      properties:
        type: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    Department:
      type: object
      properties:
        _id: { type: string }
        code: { type: string }
        name: { type: string }
        authority: { type: string, enum: [GHMC, HMWSSB, TSSPDCL, OTHER] }
        description: { type: string }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        isActive: { type: boolean }
  responses:
    Err:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  parameters:
    TrackingId:
      name: trackingId
      in: path
      required: true
      schema: { type: string }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    IncludeDemo: { name: includeDemo, in: query, schema: { type: boolean, default: false }, description: Include fictional DEMO records }
security: []
paths:
  /health:
    get:
      tags: [Meta]
      summary: Database state and AI configuration
      responses: { '200': { description: OK } }
  /data-sources:
    get:
      tags: [Meta]
      summary: Data composition and approved official aggregate datasets
      responses: { '200': { description: OK } }
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a citizen account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                phone: { type: string }
                preferredLanguage: { $ref: '#/components/schemas/Language' }
      responses:
        '201': { description: Created; sets the `token` cookie }
        '400': { $ref: '#/components/responses/Err' }
        '409': { $ref: '#/components/responses/Err' }
        '429': { $ref: '#/components/responses/Err' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        '200': { description: OK; sets the `token` cookie }
        '401': { $ref: '#/components/responses/Err' }
        '429': { $ref: '#/components/responses/Err' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      responses: { '200': { description: OK } }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ session: [] }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Err' } }
    patch:
      tags: [Auth]
      summary: Update profile or change password
      security: [{ session: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                preferredLanguage: { $ref: '#/components/schemas/Language' }
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Err' } }
  /complaints:
    get:
      tags: [Complaints]
      summary: Public paged list (DEMO excluded unless includeDemo=true)
      parameters:
        - $ref: '#/components/parameters/Page'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: area, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/IncludeDemo'
        - { name: sort, in: query, schema: { type: string, enum: [newest, priority], default: newest } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Complaint' } }
                      pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Complaints]
      summary: Submit a report
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [description, latitude, longitude]
              properties:
                description: { type: string, minLength: 15, maxLength: 2000 }
                latitude: { type: number }
                longitude: { type: number }
                category: { $ref: '#/components/schemas/Category' }
                locationAccuracy: { type: string, enum: [gps, map_pin] }
                area: { type: string }
                address: { type: string }
                title: { type: string }
                language: { $ref: '#/components/schemas/Language' }
                transcriptText: { type: string }
                transcriptEditedByUser: { type: boolean }
                image: { type: string, format: binary, description: JPG/PNG/WebP up to 10 MB (checked by content) }
                audio: { type: string, format: binary, description: Voice recording, stored privately }
      responses:
        '201': { description: 'Created. Body: { complaint, duplicate }' }
        '400': { $ref: '#/components/responses/Err' }
        '401': { $ref: '#/components/responses/Err' }
        '413': { $ref: '#/components/responses/Err' }
        '429': { $ref: '#/components/responses/Err' }
  /complaints/mine:
    get:
      tags: [Complaints]
      summary: Your own reports
      security: [{ session: [] }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Err' } }
  /complaints/map:
    get:
      tags: [Complaints]
      summary: Map points
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - $ref: '#/components/parameters/IncludeDemo'
      responses: { '200': { description: OK } }
  /complaints/analytics:
    get:
      tags: [Complaints]
      summary: Statistics computed from stored reports
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [citizen, all], default: citizen } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: area, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: OK } }
  /complaints/check-duplicates:
    post:
      tags: [Complaints]
      summary: Similar open reports nearby (advisory)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, latitude, longitude]
              properties:
                description: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                category: { $ref: '#/components/schemas/Category' }
      responses: { '200': { description: OK }, '429': { $ref: '#/components/responses/Err' } }
  /complaints/{trackingId}:
    get:
      tags: [Complaints]
      summary: Report with its public timeline
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      complaint: { $ref: '#/components/schemas/Complaint' }
                      updates: { type: array, items: { $ref: '#/components/schemas/Update' } }
                      related: { type: array, items: { type: object } }
        '404': { $ref: '#/components/responses/Err' }
  /complaints/{trackingId}/translate:
    post:
      tags: [Complaints]
      summary: Machine translation of the description (cached; original unchanged)
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [target], properties: { target: { $ref: '#/components/schemas/Language' } } }
      responses: { '200': { description: OK }, '503': { $ref: '#/components/responses/Err' } }
  /complaints/{trackingId}/support:
    post:
      tags: [Complaints]
      summary: Support a report ("I am also affected")
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Err' }, '409': { $ref: '#/components/responses/Err' } }
    delete:
      tags: [Complaints]
      summary: Remove your support
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      responses: { '200': { description: OK } }
  /voice/transcribe:
    post:
      tags: [Voice]
      summary: Speech to text (audio is not stored)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [audio], properties: { audio: { type: string, format: binary } } }
      responses: { '200': { description: 'Body: { available, noSpeech, text, language }' }, '400': { $ref: '#/components/responses/Err' } }
  /voice/speak:
    post:
      tags: [Voice]
      summary: Text to speech (WAV)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        '200': { description: WAV audio, content: { audio/wav: { schema: { type: string, format: binary } } } }
        '503': { $ref: '#/components/responses/Err' }
  /media/audio/{filename}:
    get:
      tags: [Voice]
      summary: Play a stored voice recording (reporter or admin only)
      security: [{ session: [] }]
      parameters: [{ name: filename, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Audio }, '403': { $ref: '#/components/responses/Err' }, '404': { $ref: '#/components/responses/Err' } }
  /admin/complaints:
    get:
      tags: [Admin]
      summary: Full queue (reporter details and full AI record included)
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: departmentId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean } }
        - { name: provenance, in: query, schema: { type: string, enum: [citizen, demo, all], default: all } }
        - { name: duplicatesOnly, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, priority], default: newest } }
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Err' }, '403': { $ref: '#/components/responses/Err' } }
  /admin/complaints/{trackingId}:
    get:
      tags: [Admin]
      summary: Report with all updates (public and internal) and duplicate group
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Err' } }
  /admin/complaints/{trackingId}/status:
    patch:
      tags: [Admin]
      summary: Change status (stored with timestamp and admin; rejecting needs a note)
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
                note: { type: string, maxLength: 1000 }
                isPublic: { type: boolean, default: true }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Err' }, '409': { $ref: '#/components/responses/Err' } }
  /admin/complaints/{trackingId}/department:
    patch:
      tags: [Admin]
      summary: Assign a department
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [departmentId], properties: { departmentId: { type: string }, note: { type: string } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Err' } }
  /admin/complaints/{trackingId}/category:
    patch:
      tags: [Admin]
      summary: Record the administrator-verified category
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [category], properties: { category: { $ref: '#/components/schemas/Category' }, note: { type: string } } }
      responses: { '200': { description: OK } }
  /admin/complaints/{trackingId}/comments:
    post:
      tags: [Admin]
      summary: Add an internal or public comment
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, minLength: 1, maxLength: 1000 }, isPublic: { type: boolean, default: false } } }
      responses: { '201': { description: Created } }
  /admin/complaints/{trackingId}/evidence:
    post:
      tags: [Admin]
      summary: Upload resolution evidence (image)
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/TrackingId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [evidence], properties: { evidence: { type: string, format: binary }, caption: { type: string, maxLength: 300 } } }
      responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Err' } }
  /admin/duplicates:
    get:
      tags: [Admin]
      summary: Suggested and confirmed duplicate groups
      security: [{ session: [] }]
      responses: { '200': { description: OK } }
  /admin/duplicates/{id}:
    patch:
      tags: [Admin]
      summary: Confirm or reject a duplicate suggestion (nothing is deleted)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [confirmed, rejected] } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Err' } }
  /admin/workload:
    get:
      tags: [Admin]
      summary: Department workload
      security: [{ session: [] }]
      responses: { '200': { description: OK } }
  /admin/departments:
    get:
      tags: [Admin]
      summary: List departments
      security: [{ session: [] }]
      responses: { '200': { description: OK } }
    post:
      tags: [Admin]
      summary: Create a department
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/Department' }
                - { required: [code, name] }
      responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Err' } }
  /admin/departments/{id}:
    put:
      tags: [Admin]
      summary: Update a department
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Department' } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Err' } }
